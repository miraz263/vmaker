<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <title>Story → Scene Editor</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }
    textarea {
      width: 100%;
      height: 140px;
      padding: 10px;
      font-size: 16px;
    }
    button {
      padding: 8px 16px;
      margin-top: 10px;
      font-size: 14px;
      cursor: pointer;
    }
    .scene {
      background: #fff;
      padding: 15px;
      margin-top: 15px;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .scene input {
      width: 100%;
      padding: 6px;
      margin-top: 5px;
    }
    .preview img {
      height: 70px;
      margin-right: 5px;
    }
    .save-btn {
      background: #2d7ef7;
      color: white;
      border: none;
      border-radius: 4px;
    }
    .error {
      color: red;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <input type="hidden" id="csrfToken" value="{{ csrf_token }}">

  <h1>📖 Story → Scene Editor</h1>

  <label><strong>গল্প লিখুন:</strong></label>
  <textarea id="storyText">
একদিন ভোরবেলায় ছোট্ট নীলা তার জানালার পাশে দাঁড়িয়ে সূর্য উঠতে দেখল।
হঠাৎ সে দেখল একটি আহত পাখি উঠোনে পড়ে আছে।
নীলা ধীরে ধীরে পাখিটিকে তুলে এনে পানি ও খাবার দিল।
কয়েকদিন পর পাখিটি সুস্থ হয়ে আকাশে উড়ে গেল।
উড়ে যাওয়ার সময় নীলার মনে হলো, ভালোবাসা কখনো হারায় না, তা ফিরে আসে।
  </textarea>

  <br />
  <button onclick="generateScenes()">🎬 Generate Scenes</button>

  <div id="error" class="error"></div>
  <div id="scenes"></div>

  <script>
    async function generateScenes() {
      const story = document.getElementById("storyText").value.trim();
      const csrfToken = document.getElementById("csrfToken").value;
      const errorBox = document.getElementById("error");
      errorBox.innerText = "";

      if (!story) {
        errorBox.innerText = "গল্প লেখা ফাঁকা হতে পারে না";
        return;
      }

      try {
        const response = await fetch("/api/projects/1/generate-scenes/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken
          },
          body: JSON.stringify({ story })
        });

        const data = await response.json();

        if (!response.ok) {
          errorBox.innerText = data.error || "Scene generate করতে সমস্যা হয়েছে";
          return;
        }

        renderScenes(data.scenes);

      } catch (err) {
        errorBox.innerText = "Server এ সংযোগ করা যাচ্ছে না";
      }
    }

    function renderScenes(scenes) {
      const container = document.getElementById("scenes");
      container.innerHTML = "";

      scenes.forEach((scene, index) => {
        const div = document.createElement("div");
        div.className = "scene";
        div.dataset.sceneId = scene.id;   // IMPORTANT

        const characterNames = (scene.characters || [])
          .map(c => c.key)
          .join(", ");

        const characterImages = (scene.characters || [])
          .map(c => `<img src="/media/${c.asset}" alt="${c.key}">`)
          .join("");

        div.innerHTML = `
          <h3>Scene ${scene.scene_id || index + 1}</h3>

          <label>Background</label>
          <input class="bg-input" value="${scene.background?.key || ''}" />

          <div class="preview">
            <img src="/media/${scene.background?.asset}" alt="bg">
          </div>

          <label>Characters (comma separated)</label>
          <input class="characters-input" value="${characterNames}" />

          <div class="preview">
            ${characterImages || "<em>No character</em>"}
          </div>

          <label>Narration</label>
          <input class="narration-input" value="${scene.narration?.text || ''}" />

          <label>Duration (sec)</label>
          <input class="duration-input" type="number" value="${scene.duration || 8}" />

          <button class="save-btn" onclick="saveScene(this)">
            💾 Save Scene
          </button>
        `;

        container.appendChild(div);
      });
    }

    async function saveScene(btn) {
      const card = btn.closest(".scene");
      const sceneId = card.dataset.sceneId;

      const bgKey = card.querySelector(".bg-input").value.trim();
      const narration = card.querySelector(".narration-input").value.trim();
      const duration = parseInt(card.querySelector(".duration-input").value) || 8;

      const characters = card.querySelector(".characters-input")
        .value.split(",")
        .map(c => c.trim())
        .filter(Boolean)
        .map(c => ({
          key: c,
          emotion: "neutral",
          position: "center",
          asset: `characters/${c}.png`
        }));

      const payload = {
        data: {
          background: {
            key: bgKey,
            type: "image",
            asset: `backgrounds/${bgKey}.jpg`
          },
          characters: characters,
          narration: {
            text: narration,
            voice: "female_child",
            lang: "bn"
          },
          duration: duration,
          transition: "fade"
        }
      };

      try {
        btn.innerText = "Saving...";
        btn.disabled = true;

        const res = await fetch(`/api/scenes/${sceneId}/update/`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": document.getElementById("csrfToken").value
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) {
          alert(data.error || "Save failed");
          btn.disabled = false;
          btn.innerText = "💾 Save Scene";
          return;
        }

        btn.innerText = "✅ Saved";
        setTimeout(() => {
          btn.innerText = "💾 Save Scene";
          btn.disabled = false;
        }, 1200);

      } catch (e) {
        alert("Server error");
        btn.disabled = false;
        btn.innerText = "💾 Save Scene";
      }
    }
  </script>
</body>
</html>
