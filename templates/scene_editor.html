<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Story → Scene Editor</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f4f8;
  padding: 20px;
}

textarea {
  width: 100%;
  height: 130px;
  font-size: 16px;
  padding: 10px;
}

button {
  padding: 8px 14px;
  cursor: pointer;
  font-size: 14px;
}

.scene {
  background: #fff;
  margin-top: 20px;
  border-radius: 8px;
  padding: 15px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

.row {
  display: flex;
  gap: 15px;
  margin-top: 10px;
}

.col {
  flex: 1;
}

.label {
  font-weight: bold;
  margin: 6px 0 4px;
}

.preview {
  border: 1px solid #ddd;
  border-radius: 6px;
  overflow: hidden;
  height: 120px;
}

.preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.characters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.character {
  text-align: center;
  font-size: 12px;
}

.character img {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  object-fit: cover;
}

input {
  width: 100%;
  padding: 6px;
}

.save-btn {
  background: #2d7ef7;
  color: #fff;
  border: none;
  border-radius: 4px;
  margin-top: 10px;
}

.save-btn.saved {
  background: #2da44e;
}

.error {
  color: red;
  margin-top: 10px;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>📖 Story → Scene Editor</h1>

<label class="label">গল্প লিখুন</label>
<textarea id="storyText">
এক বিকেলের নরম আলোয় ওয়ারিনা নদীর ধারে বসে ছিল।
হঠাৎ সে দেখল, জলে ভাসছে একটি ছোট কাগজের নৌকা।
নৌকার ভেতরে লেখা ছিল কারও স্বপ্নের কথা।
ওয়ারিনা নৌকাটি তুলে আবার জলে ছেড়ে দিল।
সে ভাবল, স্বপ্নেরও নদী দরকার বয়ে চলার।
</textarea>

<br><br>
<button onclick="generateScenes()">🎬 Generate Scenes</button>

<div id="error" class="error"></div>
<div id="scenes"></div>

<script>
/* ===============================
   Generate Scenes
=============================== */
async function generateScenes() {
  const story = document.getElementById("storyText").value.trim();
  const errorBox = document.getElementById("error");
  const container = document.getElementById("scenes");

  errorBox.innerText = "";
  container.innerHTML = "";

  if (!story) {
    errorBox.innerText = "গল্প লেখা ফাঁকা হতে পারে না";
    return;
  }

  try {
    const res = await fetch("/api/projects/1/generate-scenes/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ story })
    });

    const data = await res.json();

    if (!Array.isArray(data.scenes)) {
      errorBox.innerText = "Scene generate হয়নি";
      return;
    }

    renderScenes(data.scenes);

  } catch (err) {
    console.error(err);
    errorBox.innerText = "Server error";
  }
}

/* ===============================
   Render Scenes (DEDUP FIX)
=============================== */
function renderScenes(scenes) {
  const container = document.getElementById("scenes");

  scenes.forEach((scene, index) => {
    const div = document.createElement("div");
    div.className = "scene";
    div.dataset.sceneId = scene.id;

    const bg = scene.background;
    const narration = scene.narration.text;

    // 🔥 HARD DEDUP characters by key
    const uniqueCharacters = Array.from(
      new Map(
        (scene.characters || []).map(c => [c.key, c])
      ).values()
    );

    div.innerHTML = `
      <h3>🎬 Scene ${index + 1}</h3>

      <div class="row">
        <div class="col">
          <div class="label">Background</div>
          <div class="preview">
            <img src="/media/${bg.asset}">
          </div>
          <input value="${bg.key}">
        </div>

        <div class="col">
          <div class="label">Characters</div>
          <div class="characters">
            ${
              uniqueCharacters.length
                ? uniqueCharacters.map(c => `
                    <div class="character">
                      <img src="/media/${c.asset}">
                      <div>${c.key}</div>
                    </div>
                  `).join("")
                : "<em>— No character —</em>"
            }
          </div>
        </div>
      </div>

      <div class="label">Narration</div>
      <input value="${narration}">

      <div class="label">Duration (sec)</div>
      <input type="number" value="${scene.duration}">

      <button class="save-btn">💾 Save Scene</button>
    `;

    container.appendChild(div);
  });
}

/* ===============================
   Save Scene
=============================== */
async function saveScene(btn) {
  const card = btn.closest(".scene");
  const sceneId = card.dataset.sceneId;

  const bgKey = card.querySelector(".bg-input").value;
  const narrationText = card.querySelector(".narration-input").value;
  const duration = parseInt(card.querySelector(".duration-input").value) || 8;

  const payload = {
    data: {
      background: {
        key: bgKey,
        type: "image",
        asset: `backgrounds/${bgKey}.jpg`
      },
      narration: {
        text: narrationText,
        voice: "female_child",
        lang: "bn"
      },
      duration,
      transition: "fade"
    }
  };

  btn.innerText = "Saving...";
  btn.disabled = true;

  try {
    await fetch(`/api/scenes/${sceneId}/update/`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    btn.innerText = "✅ Saved";
    btn.classList.add("saved");

  } catch (e) {
    alert("Save failed");
  }

  setTimeout(() => {
    btn.innerText = "💾 Save Scene";
    btn.disabled = false;
  }, 1200);
}
</script>

</body>
</html>
