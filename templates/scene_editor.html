<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <title>Story → Scene Editor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      margin-top: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    .scene {
      background: #fff;
      padding: 15px;
      margin-top: 15px;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .scene input {
      width: 100%;
      padding: 6px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
    <input type="hidden" id="csrfToken" value="{{ csrf_token }}">


  <h1>📖 Story → Scene Editor</h1>

  <label><strong>গল্প লিখুন:</strong></label>
  <textarea id="storyText">
এক সুন্দর সকাল। ওয়ারিনা তার লাল টুপি পরে বাগানে খেলতে গেল।
সেখানে সে একটি ছোট পেঁচাকে দেখল।
  </textarea>

  <br/>
  <button onclick="generateScenes()">🎬 Generate Scenes</button>

  <div id="scenes"></div>

  <script>
    async function generateScenes() {
      const story = document.getElementById("storyText").value;
      const csrfToken = document.getElementById("csrfToken").value;
    
      const response = await fetch("/api/projects/1/generate-scenes/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": csrfToken
        },
        body: JSON.stringify({
          story: story
        })
      });
    
      const data = await response.json();
      renderScenes(data.scenes);
    }
    
    function renderScenes(scenes) {
      const container = document.getElementById("scenes");
      container.innerHTML = "";
    
      scenes.forEach((scene, index) => {
        const div = document.createElement("div");
        div.className = "scene";
    
        div.innerHTML = `
          <h3>Scene ${index + 1}</h3>
    
          <label>Background</label>
          <input value="${scene.background}" />
    
          <label>Characters</label>
          <input value="${scene.characters.join(", ")}" />
    
          <label>Narration</label>
          <input value="${scene.narration}" />
    
          <label>Duration (sec)</label>
          <input type="number" value="${scene.duration}" />
        `;
    
        container.appendChild(div);
      });
    }
    </script>
    

</body>
</html>
