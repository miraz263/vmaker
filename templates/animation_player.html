{% load static %}
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 3D Studio Animation Player | vmaker 3D</title>

<!-- Three.js and Loaders -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0b0f19;
  color: #f1f5f9;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 16px 28px;
  background: rgba(15, 23, 42, 0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 20;
}

.logo-area { display: flex; align-items: center; gap: 12px; }
.logo-badge {
  background: linear-gradient(135deg, #6366f1, #a855f7);
  color: #fff;
  padding: 4px 10px;
  border-radius: 6px;
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0.5px;
}
.title { font-size: 18px; font-weight: 600; }

.main-stage {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

#viewport-wrap {
  width: 100%;
  max-width: 1060px;
  aspect-ratio: 16 / 9;
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
  background: #000;
}

#webgl-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* Subtitle & HUD Overlays */
#subtitle-box {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  width: 85%;
  max-width: 780px;
  background: rgba(15, 23, 42, 0.82);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 10px;
  padding: 12px 24px;
  text-align: center;
  font-size: 21px;
  font-weight: 500;
  color: #ffffff;
  line-height: 1.4;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  transition: opacity 0.3s ease;
  pointer-events: none;
}

.hud-pill {
  position: absolute;
  top: 16px;
  padding: 6px 14px;
  background: rgba(15, 23, 42, 0.7);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 8px;
}

#hud-scene { left: 16px; }
#hud-viseme {
  right: 16px;
  color: #38bdf8;
  font-family: monospace;
}
.pulse-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 10px #10b981;
}

/* Control Panel */
.control-bar {
  max-width: 1060px;
  margin: 0 auto 28px;
  width: 100%;
  padding: 14px 20px;
  background: rgba(15, 23, 42, 0.9);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.btn-group { display: flex; align-items: center; gap: 10px; }

button {
  background: rgba(255, 255, 255, 0.08);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s ease;
}

button:hover {
  background: rgba(255, 255, 255, 0.16);
  border-color: rgba(255, 255, 255, 0.3);
}

button.primary {
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  border-color: transparent;
}
button.primary:hover {
  filter: brightness(1.15);
}

select {
  background: rgba(30, 41, 59, 0.9);
  color: #f8fafc;
  border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
}

.timeline-progress {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 12px;
}

.progress-bar-wrap {
  flex: 1;
  height: 6px;
  background: rgba(255, 255, 255, 0.12);
  border-radius: 3px;
  overflow: hidden;
  cursor: pointer;
}

.progress-fill {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #6366f1, #38bdf8);
  transition: width 0.1s linear;
}

.time-label {
  font-size: 13px;
  font-family: monospace;
  color: #94a3b8;
  min-width: 80px;
}
</style>
</head>

<body>

<header>
  <div class="logo-area">
    <span class="logo-badge">3D ENGINE</span>
    <span class="title">vmaker Studio WebGL Player</span>
  </div>
  <div class="btn-group">
    <button id="exportVideoBtn" style="background: linear-gradient(135deg, #10b981, #059669); border-color: transparent;">⚡ Render 1080p MP4</button>
    <button id="toggleCameraBtn">🎥 Cam: Director Mode</button>
    <a href="/editor/" style="text-decoration:none;"><button>📝 Open Editor</button></a>
  </div>
</header>

<main class="main-stage">
  <div id="viewport-wrap">
    <canvas id="webgl-canvas"></canvas>

    <div class="hud-pill" id="hud-scene">
      <div class="pulse-dot"></div>
      <span id="scene-counter">Scene 1 / 1</span>
    </div>

    <div class="hud-pill" id="hud-viseme">
      <span>LIP-SYNC: </span><b id="active-viseme">IDLE</b>
    </div>

    <div id="subtitle-box">...</div>
  </div>
</main>

<div class="control-bar">
  <div class="btn-group">
    <button class="primary" id="playBtn">▶ Play</button>
    <button id="pauseBtn">⏸ Pause</button>
    <button id="replayBtn">🔄 Replay</button>
  </div>

  <div class="timeline-progress">
    <span class="time-label" id="currentTime">00:00</span>
    <div class="progress-bar-wrap" id="progressWrap">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span class="time-label" id="totalDuration">00:00</span>
  </div>

  <div class="btn-group">
    <select id="sceneSelect"></select>
  </div>
</div>

<audio id="sceneAudio" preload="auto"></audio>

<script>
document.addEventListener("DOMContentLoaded", async () => {

/* ============================================================
   1. THREE.JS 3D SCENE SETUP
============================================================ */
const canvas = document.getElementById("webgl-canvas");
const wrap = document.getElementById("viewport-wrap");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1726);
scene.fog = new THREE.FogExp2(0x0e1726, 0.04);

const camera = new THREE.PerspectiveCamera(45, wrap.clientWidth / wrap.clientHeight, 0.1, 100);
camera.position.set(0, 1.6, 4.2);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
renderer.setSize(wrap.clientWidth, wrap.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 1.2, 0);
controls.enabled = false; // Director mode by default

// Lighting Setup
const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xfffaed, 1.1);
sunLight.position.set(4, 8, 4);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 1024;
sunLight.shadow.mapSize.height = 1024;
sunLight.shadow.bias = -0.001;
scene.add(sunLight);

const fillLight = new THREE.DirectionalLight(0x90caf9, 0.4);
fillLight.position.set(-4, 3, -2);
scene.add(fillLight);

// Ground Stage
const groundGeo = new THREE.CircleGeometry(12, 64);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x1e293b,
  roughness: 0.8,
  metalness: 0.1
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Environment Backdrop Billboard
const bgPlaneGeo = new THREE.PlaneGeometry(16, 9);
const bgTextureLoader = new THREE.TextureLoader();
let bgMaterial = new THREE.MeshBasicMaterial({ color: 0x111827 });
const bgMesh = new THREE.Mesh(bgPlaneGeo, bgMaterial);
bgMesh.position.set(0, 4.2, -5.5);
scene.add(bgMesh);

/* ============================================================
   2. PROCEDURAL 3D CHARACTER AVATAR WITH LIP-SYNC BLENDSHAPES
============================================================ */
class CharacterAvatar3D {
  constructor(name = "Avatar") {
    this.name = name;
    this.root = new THREE.Group();
    this.root.castShadow = true;

    // Body / Torso
    const torsoMat = new THREE.MeshStandardMaterial({ color: 0x6366f1, roughness: 0.5 });
    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.22, 0.7, 16), torsoMat);
    torso.position.y = 0.85;
    torso.castShadow = true;
    this.root.add(torso);

    // Head
    const headMat = new THREE.MeshStandardMaterial({ color: 0xfbd38d, roughness: 0.4 });
    this.head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 24, 24), headMat);
    this.head.position.y = 1.45;
    this.head.castShadow = true;
    this.root.add(this.head);

    // Eyes
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111827 });
    const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 12), eyeMat);
    leftEye.position.set(-0.08, 0.04, 0.22);
    this.head.add(leftEye);

    const rightEye = leftEye.clone();
    rightEye.position.x = 0.08;
    this.head.add(rightEye);

    // Stylized Cap / Hair
    const capMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.6 });
    const cap = new THREE.Mesh(new THREE.ConeGeometry(0.26, 0.22, 16), capMat);
    cap.position.set(0, 0.2, -0.02);
    cap.rotation.x = -0.15;
    this.head.add(cap);

    // Articulated Mouth (Lip-sync Target)
    const mouthMat = new THREE.MeshBasicMaterial({ color: 0x881337 });
    this.mouth = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.025, 0.02), mouthMat);
    this.mouth.position.set(0, -0.1, 0.23);
    this.head.add(this.mouth);

    // Shadow blob
    const blobGeo = new THREE.CircleGeometry(0.35, 16);
    const blobMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 });
    const shadowBlob = new THREE.Mesh(blobGeo, blobMat);
    shadowBlob.rotation.x = -Math.PI / 2;
    shadowBlob.position.y = 0.01;
    this.root.add(shadowBlob);

    this.baseY = 0;
  }

  updateViseme(blendshapes, delta) {
    if (!blendshapes) {
      this.mouth.scale.set(1, 1, 1);
      return;
    }

    const jawOpen = blendshapes.jawOpen || 0.0;
    const mouthSmile = blendshapes.mouthSmile || 0.0;
    const mouthPucker = blendshapes.mouthPucker || 0.0;

    // Dynamically deform mouth mesh according to viseme blendshapes
    const targetScaleY = 1.0 + (jawOpen * 4.5);
    const targetScaleX = 1.0 + (mouthSmile * 1.5) - (mouthPucker * 0.4);

    this.mouth.scale.y += (targetScaleY - this.mouth.scale.y) * 0.35;
    this.mouth.scale.x += (targetScaleX - this.mouth.scale.x) * 0.35;
  }

  animateIdle(time) {
    // Gentle breathing & bobbing
    this.root.position.y = this.baseY + Math.sin(time * 2.5) * 0.02;
    this.head.rotation.y = Math.sin(time * 0.8) * 0.08;
    this.head.rotation.z = Math.cos(time * 1.2) * 0.03;
  }
}

const mainAvatar = new CharacterAvatar3D("Warina");
scene.add(mainAvatar.root);

/* ============================================================
   3. AUDIO, SCENES & TIMELINE STATE
============================================================ */
const PROJECT_ID = 1;
let scenes = [];
let sceneIndex = 0;
let animation = null;
let isPlaying = false;
let sceneStartTime = 0;
let sceneDuration = 8;
let directorMode = true;

const audioElement = document.getElementById("sceneAudio");
const subtitleBox = document.getElementById("subtitle-box");
const sceneCounter = document.getElementById("scene-counter");
const activeVisemeLabel = document.getElementById("active-viseme");
const progressFill = document.getElementById("progressFill");
const currentTimeLabel = document.getElementById("currentTime");
const totalDurationLabel = document.getElementById("totalDuration");
const sceneSelect = document.getElementById("sceneSelect");

// Load scenes from backend
try {
  scenes = await fetch(`/api/projects/${PROJECT_ID}/scenes/`).then(r => r.json());
  if (scenes && scenes.length > 0) {
    scenes.forEach((s, idx) => {
      const opt = document.createElement("option");
      opt.value = idx;
      opt.innerText = `Scene ${s.order || idx + 1}`;
      sceneSelect.appendChild(opt);
    });
    await loadScene(0);
  }
} catch (err) {
  console.warn("Could not fetch scenes from API, loading fallback scene:", err);
  loadFallbackScene();
}

async function loadScene(idx) {
  sceneIndex = idx;
  sceneSelect.value = idx;
  sceneCounter.innerText = `Scene ${idx + 1} / ${scenes.length}`;

  const sceneData = scenes[idx];
  animation = await fetch(`/api/scenes/${sceneData.id}/animation/`).then(r => r.json());

  sceneDuration = animation.timeline?.duration || 8;
  totalDurationLabel.innerText = formatTime(sceneDuration);

  // Load Background Texture
  const bgPath = animation.environment?.background?.asset;
  if (bgPath) {
    bgTextureLoader.load(`/media/${bgPath}`, (tex) => {
      bgMesh.material = new THREE.MeshBasicMaterial({ map: tex });
    }, undefined, () => {
      bgMesh.material = new THREE.MeshBasicMaterial({ color: 0x1e293b });
    });
  }

  // Load Neural Audio Track if present
  const audioUrl = animation.narration?.audio_url;
  if (audioUrl) {
    audioElement.src = audioUrl;
  } else {
    audioElement.src = "";
  }

  subtitleBox.innerText = animation.narration?.text || "";
}

function loadFallbackScene() {
  sceneDuration = 8;
  totalDurationLabel.innerText = "00:08";
  subtitleBox.innerText = "এক সুন্দর সকাল। ওয়ারিনা বাগানে খেলতে গেল।";
}

/* ============================================================
   4. PLAYBACK CONTROLS
============================================================ */
const playBtn = document.getElementById("playBtn");
const pauseBtn = document.getElementById("pauseBtn");
const replayBtn = document.getElementById("replayBtn");
const toggleCameraBtn = document.getElementById("toggleCameraBtn");

playBtn.onclick = () => {
  if (isPlaying) return;
  isPlaying = true;
  sceneStartTime = performance.now();

  if (audioElement.src && audioElement.src !== window.location.href) {
    audioElement.currentTime = 0;
    audioElement.play().catch(e => console.log("Audio play error:", e));
  }
};

pauseBtn.onclick = () => {
  isPlaying = false;
  if (!audioElement.paused) audioElement.pause();
};

replayBtn.onclick = () => {
  isPlaying = false;
  sceneStartTime = performance.now();
  if (audioElement.src) audioElement.currentTime = 0;
  playBtn.click();
};

sceneSelect.onchange = (e) => {
  isPlaying = false;
  loadScene(parseInt(e.target.value));
};

toggleCameraBtn.onclick = () => {
  directorMode = !directorMode;
  controls.enabled = !directorMode;
  toggleCameraBtn.innerText = directorMode ? "🎥 Cam: Director Mode" : "🌐 Cam: Orbit Mode (Free)";
  if (directorMode) {
    camera.position.set(0, 1.6, 4.2);
    controls.target.set(0, 1.2, 0);
  }
};

/* ============================================================
   5. REAL-TIME RENDER LOOP & LIP-SYNC SOLVER
============================================================ */
let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  const elapsedTime = clock.getElapsedTime();

  let t = 0;
  if (isPlaying) {
    t = (performance.now() - sceneStartTime) / 1000;

    // Check if audio has elapsed or timeline finished
    if (t >= sceneDuration) {
      isPlaying = false;
      if (scenes.length > 0) {
        const nextIdx = (sceneIndex + 1) % scenes.length;
        loadScene(nextIdx).then(() => {
          playBtn.click();
        });
      }
      return;
    }

    // Update progress bar
    const pct = Math.min(100, (t / sceneDuration) * 100);
    progressFill.style.width = pct + "%";
    currentTimeLabel.innerText = formatTime(t);
  }

  // 1. Solve 3D Lip-Sync from Viseme Timeline
  let currentBlendshapes = null;
  let activeVisemeName = "IDLE";

  const visemes = animation?.narration?.visemes || [];
  if (isPlaying && visemes.length > 0) {
    // Find active viseme at current playback time
    const active = visemes.find(v => t >= v.time && t < (v.time + v.duration));
    if (active) {
      currentBlendshapes = active.blendshapes;
      activeVisemeName = active.viseme.replace("viseme_", "").toUpperCase();
    }
  }

  activeVisemeLabel.innerText = isPlaying ? activeVisemeName : "IDLE";
  mainAvatar.updateViseme(currentBlendshapes, delta);
  mainAvatar.animateIdle(elapsedTime);

  // 2. Cinematic Camera Smooth Motion in Director Mode
  if (directorMode) {
    const camAngle = Math.sin(elapsedTime * 0.25) * 0.35;
    camera.position.x = Math.sin(camAngle) * 4.2;
    camera.position.z = Math.cos(camAngle) * 4.2;
    camera.position.y = 1.5 + Math.sin(elapsedTime * 0.4) * 0.12;
    camera.lookAt(0, 1.25, 0);
  } else {
    controls.update();
  }

  renderer.render(scene, camera);
}

animate();

function formatTime(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, "0");
  const s = Math.floor(sec % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

// Window resize handler
window.addEventListener("resize", () => {
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

/* ============================================================
   6. EXPORT 1080p VIDEO RENDERING
============================================================ */
const exportBtn = document.getElementById("exportVideoBtn");
const renderModal = document.getElementById("renderModal");
const renderStatusText = document.getElementById("renderStatusText");
const renderProgressBar = document.getElementById("renderProgressBar");
const renderActionArea = document.getElementById("renderActionArea");
const closeRenderModalBtn = document.getElementById("closeRenderModalBtn");

closeRenderModalBtn.onclick = () => { renderModal.style.display = "none"; };

exportBtn.onclick = async () => {
  renderModal.style.display = "flex";
  renderProgressBar.style.width = "10%";
  renderStatusText.innerText = "Submitting render job to worker...";
  renderActionArea.innerHTML = `<button onclick="document.getElementById('renderModal').style.display='none'" style="background:rgba(255,255,255,0.1); border:none; padding:8px 18px; border-radius:8px; color:#fff; cursor:pointer;">Close</button>`;

  try {
    const res = await fetch(`/api/projects/${PROJECT_ID}/render/`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ resolution: "1080p", fps: 24 })
    }).then(r => r.json());

    if (!res.job_id) {
      renderStatusText.innerText = "Error: Could not start render job.";
      return;
    }

    const pollInterval = setInterval(async () => {
      const statusRes = await fetch(`/api/render-jobs/${res.job_id}/`).then(r => r.json());
      const p = statusRes.progress || 0;
      renderProgressBar.style.width = p + "%";

      if (statusRes.status === "AUDIO_GENERATING") {
        renderStatusText.innerText = `Generating Voiceover Audio... (${p}%)`;
      } else if (statusRes.status === "SCENE_COMPILING") {
        renderStatusText.innerText = `Compiling 3D Visuals & Frames... (${p}%)`;
      } else if (statusRes.status === "ENCODING") {
        renderStatusText.innerText = `Encoding 1080p MP4 Video... (${p}%)`;
      } else if (statusRes.status === "COMPLETED") {
        clearInterval(pollInterval);
        renderProgressBar.style.width = "100%";
        renderStatusText.innerHTML = `<span style="color:#10b981; font-weight:600;">✅ Video Rendering Complete!</span>`;
        renderActionArea.innerHTML = `
          <a href="${statusRes.video_url}" download style="text-decoration:none;">
            <button style="background:linear-gradient(135deg, #10b981, #059669); border:none; padding:10px 20px; border-radius:8px; color:#fff; font-weight:600; cursor:pointer; margin-right:8px;">⬇️ Download MP4</button>
          </a>
          <button onclick="document.getElementById('renderModal').style.display='none'" style="background:rgba(255,255,255,0.1); border:none; padding:10px 18px; border-radius:8px; color:#fff; cursor:pointer;">Close</button>
        `;
      } else if (statusRes.status === "FAILED") {
        clearInterval(pollInterval);
        renderStatusText.innerHTML = `<span style="color:#ef4444;">❌ Rendering Failed: ${statusRes.error_message || "Unknown error"}</span>`;
      }
    }, 1500);

  } catch (err) {
    renderStatusText.innerText = "Error connecting to render engine: " + err;
  }
};

});
</script>

<!-- Render Progress Modal -->
<div id="renderModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); backdrop-filter:blur(6px); z-index:100; justify-content:center; align-items:center;">
  <div style="background:#1e293b; border:1px solid rgba(255,255,255,0.15); border-radius:14px; padding:28px; width:90%; max-width:440px; text-align:center; box-shadow:0 25px 50px rgba(0,0,0,0.5);">
    <h3 style="margin-bottom:12px; font-size:18px;">🎬 Video Rendering Engine</h3>
    <p id="renderStatusText" style="color:#94a3b8; font-size:14px; margin-bottom:18px;">Initializing task worker...</p>
    
    <div style="height:10px; background:rgba(255,255,255,0.1); border-radius:5px; overflow:hidden; margin-bottom:20px;">
      <div id="renderProgressBar" style="width:5%; height:100%; background:linear-gradient(90deg, #10b981, #38bdf8); transition:width 0.4s ease;"></div>
    </div>
    
    <div id="renderActionArea">
      <button id="closeRenderModalBtn" style="background:rgba(255,255,255,0.1); border:none; padding:8px 18px; border-radius:8px; color:#fff; cursor:pointer;">Cancel</button>
    </div>
  </div>
</div>

</body>
</html>
