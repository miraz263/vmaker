{% load static %}
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Scene Animation Player (Movie + Sound)</title>

<style>
body { background:#111; color:#fff; font-family:Arial; }
#wrap { width:960px; margin:auto; position:relative; }
canvas { background:#000; border-radius:10px; }
#subtitle {
  position:absolute; bottom:20px; width:100%;
  text-align:center; font-size:20px;
  background:rgba(0,0,0,.5); padding:8px;
}
.controls { margin-top:10px; text-align:center; }
button { padding:6px 12px; }
</style>
</head>

<body>

<h2 align="center">🎬 Scene Animation Player</h2>

<div id="wrap">
  <canvas id="player" width="960" height="540"></canvas>
  <div id="subtitle"></div>
</div>

<div class="controls">
  <button id="playBtn">▶ Play</button>
  <button id="pauseBtn">⏸ Pause</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {

const canvas = document.getElementById("player");
const ctx = canvas.getContext("2d");
const subtitle = document.getElementById("subtitle");

const PROJECT_ID = 1;
let scenes = [];
let sceneIndex = 0;
let animation = null;
let assets = {};
let playing = false;
let startTime = 0;
let duration = 0;

/* ===============================
   LOAD SCENES
=============================== */
scenes = await fetch(`/api/projects/${PROJECT_ID}/scenes/`)
  .then(r=>r.json());

loadScene(0);

/* ===============================
   LOAD SINGLE SCENE
=============================== */
async function loadScene(i){
  sceneIndex = i;

  animation = await fetch(`/api/scenes/${scenes[i].id}/animation/`)
    .then(r=>r.json());

  duration = animation.timeline.duration;
  subtitle.innerText = "";

  await preloadImages();
  draw(0);
}

/* ===============================
   PRELOAD IMAGES
=============================== */
async function preloadImages(){
  const list = [];
  const bg = animation.environment?.background?.asset;
  if(bg && !assets[bg]) list.push(loadImg(bg));

  (animation.characters || []).forEach(c=>{
    if(c.asset && !assets[c.asset]) list.push(loadImg(c.asset));
  });

  await Promise.all(list);
}

function loadImg(src){
  return new Promise(res=>{
    const img = new Image();
    img.src = "/media/" + src;
    img.onload = ()=>{ assets[src]=img; res(); };
  });
}

/* ===============================
   🔊 TTS (FINAL WORKING VERSION)
=============================== */

function speak(){
  const n = animation?.narration;
  if (!n) return;

  const u = new SpeechSynthesisUtterance(n.text);

  // Bangla voice থাকলে নেবে, না থাকলে default
  const voices = speechSynthesis.getVoices();
  const bn = voices.find(v => v.lang && v.lang.startsWith("bn"));
  if (bn) u.voice = bn;

  u.rate = 0.9;
  u.volume = 1;

  speechSynthesis.speak(u);   // ❗ NO cancel here
}


/* ===============================
   CONTROLS
=============================== */
playBtn.onclick = () => {
  window.focus();
  playBtn.focus();

  if (playing) return;

  speak();   // 🔊 ONLY ONE CALL

  playing = true;
  startTime = performance.now();
  requestAnimationFrame(loop);
};


/* ===============================
   LOOP (MOVIE MODE)
=============================== */
function loop(now){
  if(!playing) return;

  const t = (now - startTime) / 1000;

  if(t >= duration){
    playing = false;
    sceneIndex = (sceneIndex + 1) % scenes.length;
    loadScene(sceneIndex).then(()=>playBtn.click());
    return;
  }

  draw(t);
  requestAnimationFrame(loop);
}

/* ===============================
   DRAW
=============================== */
function draw(t){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const bg = animation.environment?.background?.asset;
  if(bg && assets[bg])
    ctx.drawImage(assets[bg],0,0,canvas.width,canvas.height);

  (animation.characters || []).forEach(c=>{
    const img = assets[c.asset];
    if(!img) return;

    const p = c.initial_state.position;
    ctx.drawImage(
      img,
      canvas.width*p.x/100 - 40,
      canvas.height*p.y/100 - 80,
      80,80
    );
  });

  subtitle.innerText =
    t >= animation.narration.start_at
      ? animation.narration.text
      : "";
}

});
</script>
</body>
</html>
